[package]
name = "flexfetch-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "flexfetch"
path = "src/main.rs"

# Phase 8.6: criterion cold-start benchmark (dev-only, never shipped).
[[bench]]
name = "cold_start"
harness = false

[dependencies]
# Lua is opt-in via the `lua` feature so `--no-default-features` yields a minimal binary
# (this matches the documented build: `cargo build --release --no-default-features`).
flexfetch-core = { version = "1.0", path = "../flexfetch-core", default-features = false }
clap = { version = "4", default-features = false, features = ["std", "color", "help", "usage", "error-context", "derive"] }
serde_json = "1"
toml = "0.8"
ctrlc = "3"
# Live dashboard (--live): ratatui + crossterm are the only TUI deps, gated behind the
# `live` feature so --no-default-features stays free of them (both are pure Rust, so the
# musl cross-compile in CI is unaffected when the feature is on).
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true }
# Lock-free live dashboard (Phase 4.2): a dedicated sampler thread pushes
# SystemSnapshots through a bounded(1) crossbeam overwrite channel so the
# renderer never blocks on /proc collection — stale snapshots are dropped
# automatically when the renderer is slow. Pure Rust, so musl cross-builds
# are unaffected.
crossbeam-channel = { version = "0.5", optional = true }
# Shell completion generator (`completions <shell>` subcommand). Behind a feature so
# --no-default-features stays lean; clap_complete is small but pulls clap's full tree.
clap_complete = { version = "4", optional = true }
# QR config sharing (Phase 4.11): `--qr` renders the config as a terminal QR,
# `--import-qr <image>` reads it back via rqrr. qrcode (encode) + rqrr (decode)
# are pure Rust, but zstd-sys is a C dep — so the whole feature is opt-in (like
# `music`): it stays out of the pure-Rust musl release builds and the minimal
# binary. image (png-only, same config as core) decodes the QR screenshot.
qrcode = { version = "0.14", optional = true }
# default-features = false drops rqrr's `img` feature (image 0.23, used only
# for its GrayImage impl) — we feed it luminance via prepare_from_greyscale, so
# the tree keeps just our single image 0.25 instead of a duplicate pair.
rqrr = { version = "0.10", default-features = false, optional = true }
zstd = { version = "0.13", optional = true }
base64 = { version = "0.22", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }

[dev-dependencies]
# Phase 8.6: micro-benchmarks (`cargo bench`). Dev-only — does not affect the
# shipped binary size (the diet is about the runtime artifact).
criterion = "0.5"

[features]
default = ["live", "image-logos", "tera", "parallel", "completions", "qr"]
live = ["dep:ratatui", "dep:crossterm", "dep:crossbeam-channel"]
# Image logos (sixel/block) + PNG export need the `image` crate; the minimal
# `--no-default-features` build drops it entirely (see ROADMAP 0.2 remaining diet work).
image-logos = ["flexfetch-core/image-logos"]
# MPRIS via pure-Rust zbus (no dbus-send shell-out); opt-in, see ROADMAP 2.6.
music = ["flexfetch-core/music"]
# Template engine + parallel collection are forwarded from core so `--no-default-features`
# drops tera (plain fallback renderer) and rayon (sequential loops) — the diet (ROADMAP 0.2).
tera = ["flexfetch-core/tera"]
parallel = ["flexfetch-core/parallel"]
# `completions <shell>` subcommand (clap_complete)
completions = ["dep:clap_complete"]
# QR config sharing (Phase 4.11): `--qr` / `--import-qr`. In the default set so
# the advertised flag works out of the box; the musl release pipeline builds with
# explicit `--no-default-features --features live,image-logos,completions,parallel`
# so zstd-sys never enters the release binary (see the dep comment above; `music`
# is likewise opt-in).
qr = ["dep:qrcode", "dep:rqrr", "dep:zstd", "dep:image", "dep:base64"]
# Phase 5.4 wallpaper auto-theming (`--auto-theme`): dominant colors from the
# wallpaper become the theme. Opt-in (adds the image jpeg decoder).
auto-theme = ["flexfetch-core/auto-theme"]
