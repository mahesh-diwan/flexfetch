[package]
name = "flexfetch-core"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Tera templates are the headline differentiator, but they're also a big chunk of
# the binary. Gated behind the `tera` feature (default on) so `--no-default-features`
# can drop tera + its pest/tera-codegen deps and use the built-in plain renderer
# (template.rs) instead. See ROADMAP 0.2 diet.
tera = { version = "1", optional = true }
# Parallel module collection (rayon). Gated behind `parallel` (default on); the
# fallback is a plain sequential loop. See ROADMAP 0.2 diet.
rayon = { version = "1", optional = true }
# vendored: bundles Lua 5.4 from source so builds need no system Lua headers
# (required for musl/aarch64 cross-compilation in CI)
mlua = { version = "0.10", optional = true, features = ["lua54", "vendored"] }
libc = "0.2"
base64 = "0.21"
# Unicode-width-aware padding (Phase 7.2): Nerd Font/CJK glyphs occupy 2 cells,
# so key alignment must count display columns, not chars. Tiny, pure Rust, no deps.
unicode-width = "0.2"
# Only the PNG decoder/encoder is needed: all logos and the PNG export are PNG files.
# Default features would pull in exr, avif, gif, webp, tiff, qoi, etc. (several MB of decoders).
# Optional + gated behind the `image-logos` feature so `--no-default-features` builds drop
# the whole crate (the image decode path is only used by sixel/block logos and PNG export).
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
# MPRIS via pure-Rust zbus (no dbus-send shell-out) behind the `music` feature.
# Opt-in so the default/minimal builds stay lean; the dbus-send fallback
# remains for builds without the feature. `blocking-api` gates zbus::blocking;
# `async-io` is the executor it requires (without it, zbus fails to compile
# with unresolved `async_io`/`async_lock`/`async_process`).
zbus = { version = "5", optional = true, default-features = false, features = ["blocking-api", "async-io"] }

[features]
default = ["tera", "parallel"]
tera = ["dep:tera"]
parallel = ["dep:rayon"]
lua = ["dep:mlua"]
image-logos = ["dep:image"]
music = ["dep:zbus"]
