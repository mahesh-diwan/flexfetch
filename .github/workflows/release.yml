name: Release
on:
  push:
    tags: ["v*"]
  # Manual trigger: lets maintainers exercise the full 5-target matrix without tagging
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux (statically linked musl) — artifact names match install.sh.
          # Cross-compiled with cargo-zigbuild: pure Rust compiles fine, but linking
          # ARM objects needs a cross linker (zig provides cc/ld for any arch).
          - name: linux-amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: flexfetch-linux-amd64.tar.gz
            use_zig: true
          - name: linux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: flexfetch-linux-aarch64.tar.gz
            use_zig: true
          - name: linux-armv7
            os: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
            artifact: flexfetch-linux-armv7.tar.gz
            use_zig: true
          # macOS: single arm64 runner (macos-latest) — aarch64 builds natively,
          # x86_64 cross-compiles via rustup target (macOS clang links both arches).
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: flexfetch-macos-aarch64.tar.gz
            use_zig: false
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            artifact: flexfetch-macos-x86_64.tar.gz
            use_zig: false

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Built with --no-default-features --features live,image-logos,completions: the
      # release excludes `lua` (mlua is dead code in flexfetch-core/cli — never called,
      # LTO strips it — and dropping it keeps the tree pure Rust, no C code to compile)
      # and `tera`/`parallel` (the plain renderer + sequential loops keep the shipped
      # binary ~2 MB — see ROADMAP 0.2 diet) but INCLUDES the `live` dashboard
      # (ratatui + crossterm are pure Rust, so the musl cross-compile is unaffected; zig
      # is only needed as the cross linker), `image-logos` (image logos + PNG export),
      # and `completions` (so `flexfetch completions bash` works in installed binaries).

      # Download zig directly instead of mlugg/setup-zig@v1: the action requests
      # `zig-linux-x86_64-0.16.0.tar.xz` (os-arch naming) which ziglang.org does not
      # serve (it's `zig-x86_64-linux-0.16.0.tar.xz`, arch-os) — every mirror 404s.
      # The Linux runner is always ubuntu-latest (x86_64), so the x86_64 tarball is
      # the correct cross linker for all three musl targets (aarch64/armv7 cross-link
      # through the same zig binary). Pinned to a known-good version for reproducibility.
      - name: Install Zig (cross linker for musl)
        if: matrix.use_zig
        run: |
          curl -fsSL -o /tmp/zig.tar.xz \
            https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          mkdir -p "$HOME/.local"
          tar -xJf /tmp/zig.tar.xz -C "$HOME/.local" --strip-components=1
          # The zig binary is at the tarball TOP level (zig-x86_64-linux-0.16.0/zig),
          # so --strip-components=1 puts it at $HOME/.local/zig — NOT in bin/. Point
          # PATH at the dir that actually contains it (cargo-zigbuild resolves `zig`
          # from PATH; a wrong dir reds the build with 'Failed to find zig').
          echo "$HOME/.local" >> "$GITHUB_PATH"

      - name: Install cargo-zigbuild
        if: matrix.use_zig
        uses: taiki-e/install-action@cargo-zigbuild

      - name: Build (musl via zigbuild)
        if: matrix.use_zig
        run: cargo zigbuild --release --target ${{ matrix.target }} -p flexfetch-cli --no-default-features --features live,image-logos,completions

      - name: Build (native/cross via system clang)
        if: ${{ !matrix.use_zig }}
        run: cargo build --release --target ${{ matrix.target }} -p flexfetch-cli --no-default-features --features live,image-logos,completions

      # Size gate (Linux only, uncompressed binary): regression guard, not a diet
      # target. After the tera/rayon gating (ROADMAP 0.2) the release build
      # (live+image-logos+completions, no tera/parallel) is ~2 MB, minimal is
      # ~1.5 MB, and the full default build is ~6.3 MB. 4 MB catches regressions
      # back toward the old 8.8 MB binary while leaving headroom for the live +
      # image-logos features. Runs before UPX so it measures the real artifact.
      - name: Size gate
        if: startsWith(matrix.name, 'linux')
        run: |
          SIZE=$(wc -c < target/${{ matrix.target }}/release/flexfetch)
          echo "binary size: $SIZE bytes"
          if [ "$SIZE" -gt 4194304 ]; then
            echo "::error::binary too large ($SIZE bytes > 4 MB limit)"
            exit 1
          fi

      # UPX compress the musl/static binaries only (UPX breaks macOS code signatures).
      # Purely an optimization — never fails the release.
      - name: Compress with UPX
        if: matrix.use_zig
        uses: svenstaro/upx-action@v2
        with:
          file: target/${{ matrix.target }}/release/flexfetch
          args: --best --lzma
        continue-on-error: true

      - name: Package tarball
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/flexfetch dist/flexfetch
          cd dist && tar czf ${{ matrix.artifact }} flexfetch

      # Checksums for install.sh verification (Phase 4 installer): one .sha256
      # file per artifact, uploaded next to it so `install.sh` can fetch
      # <artifact>.sha256 and abort on mismatch. macOS lacks GNU sha256sum
      # (it ships shasum -a 256), so detect which tool exists on the runner.
      - name: Generate checksums
        run: |
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256
          else
            shasum -a 256 ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256
          fi

      # Only tag pushes (v*) have a GitHub Release to attach to. `workflow_dispatch`
      # runs are validation-only (build + size gate + package); without a tag,
      # softprops/action-gh-release errors out, which would red the whole matrix
      # even though every binary built fine. install.sh + the per-arch checksums
      # are attached alongside the tarballs.
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
            install.sh
