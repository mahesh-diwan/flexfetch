# Deep tests — valgrind leak check. Only runs on tags or manual dispatch.
# Slow (valgrind memcheck); the perf gate lives in bench.yml.
name: Deep Tests
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: deep-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  valgrind:
    name: valgrind-leak-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Build minimal release
        run: cargo build --release -p flexfetch-cli --no-default-features
      - name: Valgrind leak check
        run: |
          valgrind --error-exitcode=99 --leak-check=full \
            --errors-for-leak-kinds=definite,indirect \
            ./target/release/flexfetch --minimal --pipe >/dev/null 2>/tmp/valgrind.log
          echo "exit: $?"
          grep -E 'ERROR SUMMARY' /tmp/valgrind.log
          grep -cE 'definitely lost|indirectly lost' /tmp/valgrind.log || true
