name: Docs & Site
on:
  push:
    branches: [main]
    paths: ["site/**", "book/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

# Deploy via the built-in Pages action (Pages is configured with the source
# "GitHub Actions"). The landing page lives at site/ (static HTML/CSS/JS) and
# the mdBook is built into site/docs, so both ship as a single artifact.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site + mdBook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install mdBook
        run: cargo install mdbook --locked --no-default-features

      # book.toml sets build-dir = "target"; the CLI --dest-dir flag overrides
      # the config. --dest-dir is resolved relative to the working directory
      # (the checkout root), so site/docs lands inside the site dir.
      - name: Build book into site/docs
        run: mdbook build book --dest-dir site/docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
