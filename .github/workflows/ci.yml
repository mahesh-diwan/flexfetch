name: CI
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch/PR to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - uses: dtolnay/rust-toolchain@stable

      # Default features include `lua` (vendored mlua), which compiles bundled
      # Lua C code — ubuntu-latest ships gcc, so no extra setup is needed.
      - name: Run tests
        run: cargo test --workspace

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # Guards the documented minimal build path (README: cargo build --release
  # --no-default-features) so it keeps compiling without the lua/live/image-logos
  # features — this is also what drops the `image` crate entirely (the diet).
  minimal-build:
    name: minimal-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Build minimal (no default features)
        run: cargo build --release -p flexfetch-cli --no-default-features

      # The feature-off path for flexfetch-core is never exercised by the `test`
      # job (it runs with default features = image on), so run core's tests with
      # --no-default-features here to cover the image-less stubs and fallbacks,
      # and clippy the minimal CLI build so feature-off-only warnings are caught.
      - name: Test core without default features
        run: cargo test -p flexfetch-core --no-default-features

      - name: Clippy minimal (no default features)
        run: cargo clippy -p flexfetch-cli --no-default-features -- -D warnings

      # Core's feature-off path (image-less stubs + fallbacks) is clippy'd here too,
      # not just tested, so a future warning in the image-off config is caught in CI.
      - name: Clippy core minimal (no default features)
        run: cargo clippy -p flexfetch-core --no-default-features --all-targets -- -D warnings

  # Phase 4.11 QR config sharing is an opt-in feature (zstd-sys is a C dep, so it
  # stays out of default/minimal/release builds) — CI must still exercise it so a
  # regression in qr.rs or the feature wiring can't land silently.
  qr-feature:
    name: qr-feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Default features include `lua` (vendored mlua compiles C — ubuntu has gcc).
      - name: Test QR feature
        run: cargo test -p flexfetch-cli --features qr

      - name: Clippy QR feature
        run: cargo clippy -p flexfetch-cli --features qr --all-targets -- -D warnings

  # Phase 4.1 cold-start gate: the roadmap's sub-10ms promise applies to the
  # minimal build (the full default fetch is network-bound by design). hyperfine
  # measures `--minimal` (title/separator/os/kernel/uptime — all zero-spawn file
  # reads) with a warmup, and the mean must stay under 10 ms. Uses python3 for the
  # comparison (jq/bc are not guaranteed on runners).
  perf-gate:
    name: perf-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Build minimal release
        run: cargo build --release -p flexfetch-cli --no-default-features

      - name: Install hyperfine
        run: cargo install hyperfine --locked

      # hyperfine discards the benchmarked command's stdout by default, so no
      # --output flag is needed. Threshold: the roadmap's sub-10ms claim is the
      # dev-box target for the minimal build; shared runners can be noisier, so
      # if this ever flakes, raise `limit` in the python step to 0.015 (15 ms)
      # rather than deleting the gate.
      - name: "Measure cold start (gate: mean < 10 ms)"
        run: |
          hyperfine --warmup 5 --runs 50 \
            './target/release/flexfetch --minimal' \
            --export-json /tmp/perf.json
          python3 - <<'EOF'
          import json
          mean = json.load(open('/tmp/perf.json'))['results'][0]['mean']
          limit = 0.010
          print(f'cold start mean: {mean*1000:.2f} ms (gate: <{limit*1000:.0f} ms)')
          if mean > limit:
              print(f'::error::cold start {mean*1000:.2f} ms exceeds the {limit*1000:.0f} ms gate')
              raise SystemExit(1)
          EOF
