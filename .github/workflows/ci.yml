name: CI
on:
  push:
    branches: [main]
    paths:
      - "flexfetch-*/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "templates/**"
      - "completions/**"
      - "install.sh"
      - "uninstall.sh"
      - "scripts/flag-smoke.sh"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "flexfetch-*/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "templates/**"
      - "completions/**"
      - "install.sh"
      - "uninstall.sh"
      - "scripts/flag-smoke.sh"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  windows:
    name: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Test (core + cli, release feature set)
        run: |
          cargo test -p flexfetch-core --no-default-features
          cargo test -p flexfetch-cli --no-default-features --features live,image-logos,completions
      - name: Clippy
        run: |
          cargo clippy -p flexfetch-core --no-default-features --all-targets -- -D warnings
          cargo clippy -p flexfetch-cli --no-default-features --features live,image-logos,completions --all-targets -- -D warnings

  minimal-build:
    name: minimal-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo build --release -p flexfetch-cli --no-default-features
      - run: cargo test -p flexfetch-core --no-default-features
      - run: cargo clippy -p flexfetch-cli --no-default-features -- -D warnings
      - run: cargo clippy -p flexfetch-core --no-default-features --all-targets -- -D warnings

  qr-feature:
    name: qr-feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo test -p flexfetch-cli --features qr
      - run: cargo clippy -p flexfetch-cli --features qr --all-targets -- -D warnings

  installer:
    name: installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: bash -n install.sh
      - name: shellcheck (if available)
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck install.sh
          else
            echo "shellcheck not installed — skipping"
          fi
      - name: --help exits 0
        run: bash install.sh --help >/dev/null
      - name: unknown flag exits 2
        run: |
          bash install.sh --definitely-not-a-flag >/dev/null 2>&1
          test $? -eq 2
      - name: --dry-run with pinned tag (no network, no writes)
        run: |
          before=$(find . -newer install.sh | wc -l)
          bash install.sh --dry-run --version v0.0.0 >/dev/null
          after=$(find . -newer install.sh | wc -l)
          test "$before" -eq "$after"
      - name: --check exit-code contract (pinned tag, no network)
        run: |
          # flexfetch not on PATH in CI -> "not installed" = exit 2
          bash install.sh --check --version v0.0.0 >/dev/null 2>&1
          test $? -eq 2
