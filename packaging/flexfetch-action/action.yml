# flexfetch-action — display runner system info in GitHub Actions logs.
#
# Composite action: installs flexfetch (skips when already present) and prints
# the fetch as a collapsible `::group::` block via `--format github` — GitHub
# renders it as a foldable, colorized section in any workflow step's log.
#
# Usage:
#   steps:
#     - uses: mahesh-diwan/flexfetch@main
#       with:
#         format: github   # github (default) | markdown | json
#         theme: catppuccin
#         modules: os,kernel,memory
name: flexfetch-action
description: Display runner system information in GitHub Actions logs using flexfetch
author: mahesh-diwan
branding:
  icon: activity
  color: blue

inputs:
  format:
    description: >-
      Output format — `github` renders a collapsible ::group:: log block
      (default), `markdown` strips ANSI for plain text, `json` emits raw facts.
    required: false
    default: github
  theme:
    description: Theme preset name (e.g. catppuccin, nord) or empty for the default.
    required: false
    default: ""
  modules:
    description: >-
      Comma-separated module list to show (defaults to the configured preset).
      Example: os,kernel,cpu,memory,disk
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install flexfetch
      shell: bash
      run: |
        if command -v flexfetch >/dev/null 2>&1; then
          echo "flexfetch already installed: $(flexfetch --version | head -1)"
        else
          curl -fsSL https://raw.githubusercontent.com/mahesh-diwan/flexfetch/main/install.sh | sh
        fi
    - name: Show system info
      shell: bash
      run: |
        ARGS=(--format "${{ inputs.format }}")
        if [ -n "${{ inputs.theme }}" ]; then ARGS+=(--theme "${{ inputs.theme }}"); fi
        if [ -n "${{ inputs.modules }}" ]; then ARGS+=(--modules "${{ inputs.modules }}"); fi
        flexfetch "${ARGS[@]}"
