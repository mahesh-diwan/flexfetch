# git-cliff changelog configuration (https://git-cliff.org)
# Generate with: git-cliff -o CHANGELOG.md
# (optionally: git-cliff --tag v0.16.0 -o CHANGELOG.md for a specific release)

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
footer = """
<!-- generated by git-cliff -->
"""
# Remove the "chore(version)" commit that git-cliff itself may produce when
# bumping, and collapse squashed/merge commits so they don't clutter the log.
postprocessors = [
  { pattern = '^chore\(version\):.*$', replace = "" },
  { pattern = '^Merge branch.*$', replace = "" },
  { pattern = '^Merge pull request.*$', replace = "" },
]

[git]
conventional_commits = true
# Only consider commits on the main branch since the last tag.
filter_unconventional = false
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^docs", group = "Documentation" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^test", group = "Testing" },
  { message = "^ci|^build", group = "Build & CI" },
  { message = "^chore", group = "Miscellaneous Tasks" },
  { message = ".*", group = "Other" },
]
# Classify PR-style "feat: x (#123)" and "fix(x): y" correctly.
protect_breaking_commits = false
