# Phase 4.12 — WASM plugin runtime (flexfetch-wasm).
#
# This crate is deliberately NOT a workspace member (same pattern as fuzz/):
# wasmtime + cranelift is one of the heaviest trees in the ecosystem, and it
# would slow every `cargo build --workspace` / CI job to a crawl. It is a
# plain path dependency of flexfetch-cli, pulled only by the `wasm-plugins`
# feature (off by default):
#
#   cargo build -p flexfetch-cli --features wasm-plugins
#
# Runtime sandboxing: fuel-limited execution (Config::consume_fuel) + a hard
# memory cap (StoreLimits) + capability-gated host imports (a plugin can only
# call the host functions its declared capabilities allow; anything else fails
# at link/instantiate time).

[package]
name = "flexfetch-wasm"
version = "0.18.0"
edition = "2021"
license = "MIT"
description = "Sandboxed WASM plugin runtime for flexfetch (Phase 4.12)"

[dependencies]
wasmtime = "47"
serde_json = "1"
# default-features = false so a `--no-default-features --features wasm-plugins`
# build doesn't get core's tera/rayon pulled in by feature unification.
flexfetch-core = { path = "../flexfetch-core", default-features = false }

[dev-dependencies]
# Compile WAT fixtures to wasm in tests (tiny, pure Rust, no target needed).
wat = "1"
