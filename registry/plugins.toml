# flexfetch plugin registry (Phase 5.7)
#
# Hosted at:
#   https://raw.githubusercontent.com/mahesh-diwan/flexfetch/main/registry/plugins.toml
#
# Consumed by `flexfetch plugin search|install|update`. Every download is
# SHA-256 verified against `sha256` before it touches the plugins dir
# (~/.config/flexfetch/plugins/), `min_flexfetch_version` is compared against
# the running binary before install, and (Phase 8.12) any entry carrying a
# `signature` must verify against the project's Ed25519 publisher key embedded
# in the client (`TRUSTED_PUBLISHER_KEY` in flexfetch-cli/src/registry.rs).
#
# To publish a plugin: open a PR adding an entry here. Entries should include
# an Ed25519 signature made with the project's private key:
#
#   cargo run --example registry_sign -- your.lua <seed-hex-32-bytes>
#   # prints: <public-key-base64>
#   #          <signature-base64>  <- paste as `signature` below
#
# plus `sha256` (sha256sum your.lua). Unsigned entries install with a warning
# and sha256-only verification (backwards-compatible).

[[plugins]]
name = "hello"
description = "Example plugin: greets the current user from Lua"
version = "1.0.0"
min_flexfetch_version = "1.0.0"
url = "https://raw.githubusercontent.com/mahesh-diwan/flexfetch/main/tests/fixtures/plugins/hello.lua"
sha256 = "cd1357d071f02094ae1b33eac710bec19dc2f51f9f4c79896c603c04d4de5608"
signature = "+g48Ps3mYZC8OXw6URMeAZTB2nxi1TX7/QumdzT/ehxCMvhWH5S+vefh/0kD57MIzH0wAvDfNnHXnFiwUbvSCA=="
